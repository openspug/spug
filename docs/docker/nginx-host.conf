# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules.
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {
        listen       127.0.0.1:8089 default_server;
        server_name  _;
        root         /data/spug/spug_web/build;
	client_max_body_size	0;
        add_header   X-Frame-Options SAMEORIGIN always;

	gzip  on;
	gzip_min_length  1k;
	gzip_buffers     4 16k;
	gzip_http_version 1.1;
	gzip_comp_level 7;
	gzip_types       text/plain text/css text/javascript application/javascript application/json;
	gzip_disable "MSIE [1-6]\.";
	gzip_vary on;

        # 智能体对话 SSE：必须关闭缓冲与 gzip，否则事件会被攒在缓冲区里一次性下发
        location ^~ /api/ai/session/stream/ {
                rewrite ^/api(.*) $1 break;
                proxy_pass http://127.0.0.1:9001;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_cache off;
                gzip off;
                chunked_transfer_encoding on;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_redirect off;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Docker 容器资源采样 SSE。必须用 ^~ 前缀：下面的 ^~ /api/ 一旦成为
        # 最长前缀匹配就会中止正则匹配，写成 location ~ 反而不会生效。
        location ^~ /api/docker/stats/ {
                rewrite ^/api(.*) $1 break;
                proxy_pass http://127.0.0.1:9001;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_cache off;
                gzip off;
                chunked_transfer_encoding on;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_redirect off;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Docker 日志跟随 SSE，同样要绕开缓冲和 180s 读超时
        location ^~ /api/docker/logs/ {
                rewrite ^/api(.*) $1 break;
                proxy_pass http://127.0.0.1:9001;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_cache off;
                gzip off;
                chunked_transfer_encoding on;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_redirect off;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/ {
                rewrite ^/api(.*) $1 break;
                proxy_pass http://127.0.0.1:9001;
		proxy_read_timeout 180s;
                proxy_redirect off;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/ws/ {
                rewrite ^/api(.*) $1 break;
                proxy_pass http://127.0.0.1:9002;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
       
        location / {
                try_files $uri /index.html;
        }
    }
}
